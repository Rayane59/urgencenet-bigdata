x-spark: &spark
  image: urgencenet-spark:3.5.3
  build: .
  entrypoint: []
services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "urgences", "--partitions", "3", "--replication-factor", "1"]
  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["127.0.0.1:8080:8080"]
  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1g", "spark://spark-master:7077"]
  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1g", "spark://spark-master:7077"]
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: urgencenet
      MINIO_ROOT_PASSWORD: urgency-demo-local
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["lake-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-ec"]
    command: ['for i in $$(seq 1 60); do mc alias set local http://minio:9000 urgencenet urgency-demo-local && mc mb --ignore-existing local/lake && exit 0; sleep 2; done; exit 1']
    volumes: ["./data:/input:ro"]
  jupyter:
    <<: *spark
    user: root
    hostname: jupyter
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--ServerApp.root_dir=/project"]
    ports: ["127.0.0.1:8888:8888", "127.0.0.1:4040:4040", "127.0.0.1:18080:18080"]
    volumes: ["./:/project"]
volumes:
  lake-data:
  kafka-data:
